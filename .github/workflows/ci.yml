name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Self-test (zero dependencies)
        run: python selftest.py
      - name: CLI + exports (JSON / JUnit)
        run: python -m numguard cases/ae_overview.json --json results.json --junit results.xml
      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q
